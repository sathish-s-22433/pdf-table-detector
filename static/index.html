<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Table Detector</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #eceff1; }
  header { position: sticky; top: 0; z-index: 10; background: #263238; color: #fff;
           padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { padding: 7px 14px; border: 0; border-radius: 4px; background: #1e88e5;
           color: #fff; cursor: pointer; font-size: 14px; }
  button:disabled { background: #78909c; cursor: not-allowed; }
  label { font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .sw { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
  #status { font-size: 13px; opacity: .9; }
  #pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .page { position: relative; box-shadow: 0 2px 8px rgba(0,0,0,.3); background: #fff; }
  .page canvas { display: block; }
  .page canvas.overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <input type="file" id="file" accept="application/pdf">
  <button id="detect" disabled>Detect Tables</button>
  <label><input type="checkbox" id="showCells" checked><span class="sw" style="background:#111"></span>Cells</label>
  <label><input type="checkbox" id="showRows" checked><span class="sw" style="background:#2e7d32"></span>Rows</label>
  <label><input type="checkbox" id="showCols" checked><span class="sw" style="background:#d81b60"></span>Columns</label>
  <label><input type="checkbox" id="showLabels" checked><span class="sw" style="background:#e53935"></span>Labels</label>
  <span id="status">Choose a PDF to begin.</span>
</header>
<div id="pages"></div>

<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

const SCALE = 1.5;
const COLORS = {
  table: "#e53935",
  cell: "#111111",
  merged: "rgba(255,193,7,0.22)",
  row: "#2e7d32",
  col: "#d81b60",
};
const WIDTH = { table: 5, cell: 3, row: 4, col: 4 };
const DASH = [14, 6];
const $ = id => document.getElementById(id);
let currentFile = null;
let pageInfo = [];
let lastResult = null;

$("file").addEventListener("change", async e => {
  currentFile = e.target.files[0];
  if (!currentFile) return;
  lastResult = null;
  $("detect").disabled = true;
  $("status").textContent = "Rendering pages…";
  await renderPdf(await currentFile.arrayBuffer());
  $("detect").disabled = false;
  $("status").textContent = `${pageInfo.length} page(s) loaded. Click "Detect Tables".`;
});

async function renderPdf(buffer) {
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const container = $("pages");
  container.innerHTML = "";
  pageInfo = [];

  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: SCALE });
    const wrap = document.createElement("div");
    wrap.className = "page";
    wrap.style.width = vp.width + "px";
    wrap.style.height = vp.height + "px";

    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    const overlay = document.createElement("canvas");
    overlay.className = "overlay";
    overlay.width = vp.width; overlay.height = vp.height;

    wrap.append(canvas, overlay);
    container.appendChild(wrap);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    pageInfo.push({ ctx: overlay.getContext("2d"), w: vp.width, h: vp.height });
  }
}

$("detect").addEventListener("click", async () => {
  if (!currentFile) return;
  $("detect").disabled = true;
  $("status").textContent = "Detecting tables…";
  const fd = new FormData();
  fd.append("file", currentFile);
  try {
    const res = await fetch("/api/detect", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    lastResult = data;
    draw();
    $("status").textContent = data.tables.length
      ? `Found ${data.tables.length} table(s).`
      : "No tables found.";
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  } finally {
    $("detect").disabled = false;
  }
});

["showCells", "showRows", "showCols", "showLabels"]
  .forEach(id => $(id).addEventListener("change", draw));

// Row / column boundaries (in PDF points) derived from the cells
function gridLines(table) {
  const rowTop = {}, rowBottom = {}, colLeft = {}, colRight = {};
  for (const c of table.cells) {
    const b = c.bbox;
    const r0 = c.row, r1 = c.row + c.rowspan - 1;
    const c0 = c.column, c1 = c.column + c.colspan - 1;
    rowTop[r0]    = Math.min(rowTop[r0] ?? Infinity, b.top);
    rowBottom[r1] = Math.max(rowBottom[r1] ?? -Infinity, b.bottom);
    colLeft[c0]   = Math.min(colLeft[c0] ?? Infinity, b.x0);
    colRight[c1]  = Math.max(colRight[c1] ?? -Infinity, b.x1);
  }
  const rows = Object.keys(rowTop).map(Number).sort((a, b) => a - b);
  const cols = Object.keys(colLeft).map(Number).sort((a, b) => a - b);
  return {
    rows: rows.map(r => ({ i: r, top: rowTop[r], bottom: rowBottom[r] ?? rowTop[r] })),
    cols: cols.map(c => ({ i: c, left: colLeft[c], right: colRight[c] ?? colLeft[c] })),
  };
}

function tag(ctx, text, x, y, color) {
  ctx.font = "bold 14px sans-serif";
  const w = ctx.measureText(text).width + 8;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, 19);
  ctx.fillStyle = "#fff";
  ctx.fillText(text, x + 4, y + 14);
}

function draw() {
  pageInfo.forEach(p => p.ctx.clearRect(0, 0, p.w, p.h));
  if (!lastResult) return;
  const showCells = $("showCells").checked, showRows = $("showRows").checked;
  const showCols = $("showCols").checked, showLabels = $("showLabels").checked;
  const s = SCALE;

  for (const t of lastResult.tables) {
    const p = pageInfo[t.page_number - 1];
    if (!p) continue;
    const ctx = p.ctx;
    const b = t.bbox;

    // 1) merged-cell tint + dark cell outlines
    if (showCells) {
      for (const c of t.cells) {
        const cb = c.bbox;
        const x = cb.x0 * s, y = cb.top * s;
        const w = (cb.x1 - cb.x0) * s, h = (cb.bottom - cb.top) * s;
        if (c.is_merged) { ctx.fillStyle = COLORS.merged; ctx.fillRect(x, y, w, h); }
        ctx.lineWidth = WIDTH.cell;
        ctx.strokeStyle = COLORS.cell;
        ctx.strokeRect(x, y, w, h);
      }
    }

    const g = gridLines(t);

    // 2) row boundaries (green, dashed)
    if (showRows) {
      ctx.save();
      ctx.lineWidth = WIDTH.row;
      ctx.strokeStyle = COLORS.row;
      ctx.setLineDash(DASH);
      const ys = new Set();
      g.rows.forEach(r => { ys.add(r.top); ys.add(r.bottom); });
      for (const y of ys) {
        ctx.beginPath();
        ctx.moveTo(b.x0 * s, y * s);
        ctx.lineTo(b.x1 * s, y * s);
        ctx.stroke();
      }
      ctx.restore();
      if (showLabels) {
        g.rows.forEach(r => tag(ctx, "R" + (r.i + 1),
          Math.max(0, b.x0 * s - 38), ((r.top + r.bottom) / 2) * s - 9, COLORS.row));
      }
    }

    // 3) column boundaries (magenta, dashed)
    if (showCols) {
      ctx.save();
      ctx.lineWidth = WIDTH.col;
      ctx.strokeStyle = COLORS.col;
      ctx.setLineDash(DASH);
      const xs = new Set();
      g.cols.forEach(c => { xs.add(c.left); xs.add(c.right); });
      for (const x of xs) {
        ctx.beginPath();
        ctx.moveTo(x * s, b.top * s);
        ctx.lineTo(x * s, b.bottom * s);
        ctx.stroke();
      }
      ctx.restore();
      if (showLabels) {
        g.cols.forEach(c => tag(ctx, "C" + (c.i + 1),
          ((c.left + c.right) / 2) * s - 12, b.bottom * s + 4, COLORS.col));
      }
    }

    // 4) table box (red) + label
    ctx.lineWidth = WIDTH.table;
    ctx.strokeStyle = COLORS.table;
    ctx.strokeRect(b.x0 * s, b.top * s, (b.x1 - b.x0) * s, (b.bottom - b.top) * s);

    if (showLabels) {
      const label = `${t.table_id}  ${t.row_count}×${t.column_count}`;
      tag(ctx, label, b.x0 * s, Math.max(0, b.top * s - 22), COLORS.table);
    }
  }
}
</script>
</body>
</html>
